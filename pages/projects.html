<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../src/images/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>IQRAA Digital Learning | AI Learning Operations ERP</title>
    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/pages/workspace.css" />
    <link rel="stylesheet" href="../css/pages/list-page.css" />
    <link rel="stylesheet" href="../css/components/tabs.css" />
  </head>
  <body>
    <div class="workspace-shell">
      <div id="sidebar-root"></div>
      <div class="workspace-shell__body">
        <div id="workspace-header-root"></div>
        <main id="main-content" class="workspace-main workspace-main--list-page">
          <div class="list-page">
            <div class="kpi-grid" id="projects-kpi-grid"></div>

            <div id="projects-tabs-root"></div>

            <div class="list-page__toolbar">
              <div class="list-page__search">
                <label class="sr-only" for="projects-search" data-i18n="projects.searchPlaceholder"></label>
                <input
                  type="search"
                  id="projects-search"
                  class="text-field__input"
                  data-i18n-attr="placeholder:projects.searchPlaceholder"
                />
              </div>
              <div class="list-page__filters">
                <label class="sr-only" for="projects-filter-status" data-i18n="projects.filterStatusLabel"></label>
                <select id="projects-filter-status" class="select"></select>
              </div>
            </div>

            <section class="panel" data-i18n-attr="aria-label:sidebar.projects">
              <div id="projects-list-body"></div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <div id="a11y-widget-root"></div>

    <script>
      window.IQRAA_PATHS = { root: "../", pages: "" };
      (function () {
        /* This page is shared by Admin ("Projects"), PM and Team Member
           (both "My Projects") — no single window.IQRAA_ROLE constant
           applies, so just enough of workspace-chrome.js's role lookup is
           repeated here to pick the right header title before it renders.
           See workspace-chrome.js and js/pages/projects.js for the rest. */
        var storedRole = null;
        try {
          storedRole = window.sessionStorage.getItem("iqraa-demo-role");
        } catch {
          /* ignore */
        }
        window.IQRAA_PAGE_TITLE_KEY = storedRole === "pm" || storedRole === "teamMember" ? "sidebar.myProjects" : "sidebar.projects";
      })();
    </script>
    <script src="../js/i18n/translations.js"></script>
    <script src="../js/i18n/i18n.js"></script>
    <script src="../js/vendor/icons.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/workspace-header.js"></script>
    <script src="../js/components/accessibility-widget.js"></script>
    <script src="../js/services/auth.js"></script>
    <script src="../js/data/mock-data.js"></script>
    <script src="../js/services/project-helpers.js"></script>
    <script src="../js/services/projects-api.js"></script>
    <script src="../js/workspace-chrome.js"></script>
    <script src="../js/pages/projects.js"></script>
  </body>
</html>
