<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../src/images/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>IQRAA Digital Learning | AI Learning Operations ERP</title>
    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/pages/workspace.css" />
    <link rel="stylesheet" href="../css/pages/project-workspace.css" />
  </head>
  <body>
    <div class="workspace-shell">
      <div id="sidebar-root"></div>
      <div class="workspace-shell__body">
        <div id="workspace-header-root"></div>
        <main id="main-content" class="workspace-main workspace-main--project-workspace">
          <div class="project-workspace">
            <a href="projects.html" class="project-workspace__back" id="project-workspace-back">
              <span data-i18n="projectWorkspace.backLink"></span>
            </a>
            <div id="project-workspace-content"></div>
          </div>
        </main>
      </div>
    </div>

    <div id="a11y-widget-root"></div>
    <div id="modal-root"></div>

    <script>
      window.IQRAA_PATHS = { root: "../", pages: "" };
    </script>
    <script src="../js/i18n/translations.js"></script>
    <script src="../js/i18n/i18n.js"></script>
    <script src="../js/vendor/icons.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/workspace-header.js"></script>
    <script src="../js/components/accessibility-widget.js"></script>
    <script src="../js/components/modal.js"></script>
    <script src="../js/services/auth.js"></script>
    <script src="../js/data/mock-data.js"></script>
    <script src="../js/services/project-helpers.js"></script>
    <script src="../js/services/projects-api.js"></script>
    <script>
      (function () {
        /* 2026-09-21k "Connect Projects to Airtable": the project this id
           points to is now fetched async (js/pages/project-workspace.js),
           so the real project name can't be read synchronously here the
           way the old mock-data version did — window.IQRAA_PAGE_TITLE_KEY
           shows a "loading" placeholder instead until the fetch resolves
           and project-workspace.js updates the header title directly. */
        var params = new URLSearchParams(window.location.search);
        window.IQRAA_CURRENT_PROJECT_ID = params.get("id");
        window.IQRAA_PAGE_TITLE_KEY = "projects.loading";
      })();
    </script>
    <script src="../js/workspace-chrome.js"></script>
    <script src="../js/pages/project-workspace.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("project-workspace-back").innerHTML =
          IQRAA.icons.arrowLeft(16) + document.getElementById("project-workspace-back").innerHTML;
      });
    </script>
  </body>
</html>
