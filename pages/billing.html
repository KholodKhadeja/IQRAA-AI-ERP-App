<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../src/images/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>IQRAA Digital Learning | AI Learning Operations ERP</title>
    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/pages/workspace.css" />
    <link rel="stylesheet" href="../css/pages/list-page.css" />
    <link rel="stylesheet" href="../css/pages/billing.css" />
  </head>
  <body>
    <div class="workspace-shell">
      <div id="sidebar-root"></div>
      <div class="workspace-shell__body">
        <div id="workspace-header-root"></div>
        <main id="main-content" class="workspace-main workspace-main--list-page">
          <div class="list-page">
            <div class="billing-kpi-section billing-kpi-section--invoices">
              <p class="billing-kpi-section__title" data-i18n="billing.invoicesSnapshotHeading"></p>
              <div class="kpi-grid" id="billing-invoices-kpi-grid"></div>
            </div>

            <div class="billing-kpi-section billing-kpi-section--payments">
              <p class="billing-kpi-section__title" data-i18n="billing.paymentsSnapshotHeading"></p>
              <div class="kpi-grid" id="billing-payments-kpi-grid"></div>
            </div>

            <section class="panel billing-panel billing-panel--invoices" aria-labelledby="billing-invoices-heading">
              <div class="panel__header">
                <div class="billing-panel-heading">
                  <span class="billing-panel-heading__icon" id="invoices-panel-icon" aria-hidden="true"></span>
                  <h2 class="panel__title" id="billing-invoices-heading" data-i18n="billing.sectionInvoices"></h2>
                  <span class="billing-panel-heading__count" id="invoices-count-badge"></span>
                </div>
              </div>
              <div class="list-page__toolbar billing-toolbar">
                <div class="list-page__search">
                  <label class="sr-only" for="invoices-search" data-i18n="billing.invoiceSearchPlaceholder"></label>
                  <input type="search" id="invoices-search" class="text-field__input" data-i18n-attr="placeholder:billing.invoiceSearchPlaceholder" />
                </div>
                <div class="list-page__filters">
                  <label class="sr-only" for="invoices-filter-status" data-i18n="billing.filterInvoiceStatusLabel"></label>
                  <select id="invoices-filter-status" class="select"></select>
                  <label class="sr-only" for="invoices-sort" data-i18n="billing.sortLabel"></label>
                  <select id="invoices-sort" class="select"></select>
                </div>
                <button type="button" class="btn btn--primary" id="invoices-create-btn">
                  <span data-i18n="billing.createInvoiceButton"></span>
                </button>
              </div>
              <div id="invoices-list-body"></div>
            </section>

            <section class="panel billing-panel billing-panel--payments" aria-labelledby="billing-payments-heading">
              <div class="panel__header">
                <div class="billing-panel-heading">
                  <span class="billing-panel-heading__icon" id="payments-panel-icon" aria-hidden="true"></span>
                  <h2 class="panel__title" id="billing-payments-heading" data-i18n="billing.sectionPayments"></h2>
                  <span class="billing-panel-heading__count" id="payments-count-badge"></span>
                </div>
              </div>
              <div class="list-page__toolbar billing-toolbar">
                <div class="list-page__search">
                  <label class="sr-only" for="payments-search" data-i18n="billing.paymentSearchPlaceholder"></label>
                  <input type="search" id="payments-search" class="text-field__input" data-i18n-attr="placeholder:billing.paymentSearchPlaceholder" />
                </div>
                <div class="list-page__filters">
                  <label class="sr-only" for="payments-filter-status" data-i18n="billing.filterPaymentRecordStatusLabel"></label>
                  <select id="payments-filter-status" class="select"></select>
                  <label class="sr-only" for="payments-filter-client" data-i18n="billing.filterClientLabel"></label>
                  <select id="payments-filter-client" class="select"></select>
                  <label class="sr-only" for="payments-filter-project" data-i18n="billing.filterProjectLabel"></label>
                  <select id="payments-filter-project" class="select"></select>
                  <label class="sr-only" for="payments-filter-due-from" data-i18n="billing.dueFromLabel"></label>
                  <input type="date" id="payments-filter-due-from" class="text-field__input" />
                  <label class="sr-only" for="payments-filter-due-to" data-i18n="billing.dueToLabel"></label>
                  <input type="date" id="payments-filter-due-to" class="text-field__input" />
                  <label class="sr-only" for="payments-sort" data-i18n="billing.sortLabel"></label>
                  <select id="payments-sort" class="select"></select>
                </div>
                <button type="button" class="btn btn--primary" id="payments-create-btn">
                  <span data-i18n="billing.recordPaymentButton"></span>
                </button>
              </div>
              <div id="payments-list-body"></div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <div id="a11y-widget-root"></div>
    <div id="modal-root"></div>

    <script>
      window.IQRAA_PATHS = { root: "../", pages: "" };
      window.IQRAA_ROLE = "admin";
      window.IQRAA_PAGE_TITLE_KEY = "sidebar.billing";
    </script>
    <script src="../js/i18n/translations.js"></script>
    <script src="../js/i18n/i18n.js"></script>
    <script src="../js/vendor/icons.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/workspace-header.js"></script>
    <script src="../js/components/accessibility-widget.js"></script>
    <script src="../js/components/modal.js"></script>
    <script src="../js/components/text-field.js"></script>
    <script src="../js/services/auth.js"></script>
    <script src="../js/services/billing-api.js"></script>
    <script src="../js/services/clients-api.js"></script>
    <script src="../js/services/finance-webhooks.js"></script>
    <script src="../js/data/mock-data.js"></script>
    <script src="../js/services/project-helpers.js"></script>
    <script src="../js/workspace-chrome.js"></script>
    <script src="../js/pages/billing.js"></script>
  </body>
</html>
