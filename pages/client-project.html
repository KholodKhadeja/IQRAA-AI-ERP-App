<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../src/images/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>IQRAA Digital Learning | AI Learning Operations ERP</title>
    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/pages/workspace.css" />
    <link rel="stylesheet" href="../css/pages/project-workspace.css" />
  </head>
  <body>
    <div class="workspace-shell">
      <div id="sidebar-root"></div>
      <div class="workspace-shell__body">
        <div id="workspace-header-root"></div>
        <main id="main-content" class="workspace-main workspace-main--project-workspace">
          <div class="project-workspace">
            <a href="dashboard-client.html" class="project-workspace__back" id="client-project-back">
              <span data-i18n="clientProject.backLink"></span>
            </a>
            <div id="client-project-content"></div>
          </div>
        </main>
      </div>
    </div>

    <div id="a11y-widget-root"></div>

    <script>
      window.IQRAA_PATHS = { root: "../", pages: "" };
      window.IQRAA_ROLE = "client";
    </script>
    <script src="../js/i18n/translations.js"></script>
    <script src="../js/i18n/i18n.js"></script>
    <script src="../js/vendor/icons.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/workspace-header.js"></script>
    <script src="../js/components/accessibility-widget.js"></script>
    <script src="../js/services/auth.js"></script>
    <script src="../js/data/mock-data.js"></script>
    <script src="../js/services/project-helpers.js"></script>
    <script src="../js/services/clients-api.js"></script>
    <script>
      (function () {
        /* 2026-09-22b "Connect Clients to Airtable": which project this
           id points to (and its name) can no longer be read synchronously
           here — it's fetched async, scoped server-side to the
           authenticated client (js/pages/client-project.js) — so this
           just shows a "loading" placeholder title until that resolves
           and updates the header directly, same pattern as
           project-workspace.html. */
        window.IQRAA_PAGE_TITLE_KEY = "clientProject.loading";
      })();
    </script>
    <script src="../js/workspace-chrome.js"></script>
    <script src="../js/pages/client-project.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        document.getElementById("client-project-back").innerHTML =
          IQRAA.icons.arrowLeft(16) + document.getElementById("client-project-back").innerHTML;
      });
    </script>
  </body>
</html>
