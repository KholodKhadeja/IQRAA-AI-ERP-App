<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../src/images/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>IQRAA Digital Learning | AI Learning Operations ERP</title>
    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/pages/workspace.css" />
    <link rel="stylesheet" href="../css/pages/list-page.css" />
    <link rel="stylesheet" href="../css/components/tabs.css" />
  </head>
  <body>
    <div class="workspace-shell">
      <div id="sidebar-root"></div>
      <div class="workspace-shell__body">
        <div id="workspace-header-root"></div>
        <main id="main-content" class="workspace-main workspace-main--list-page">
          <div class="list-page">
            <div class="kpi-grid" id="clients-kpi-grid"></div>

            <div id="clients-tabs-root"></div>

            <div class="list-page__toolbar">
              <div class="list-page__search">
                <label class="sr-only" for="clients-search" data-i18n="clients.searchPlaceholder"></label>
                <input
                  type="search"
                  id="clients-search"
                  class="text-field__input"
                  data-i18n-attr="placeholder:clients.searchPlaceholder"
                />
              </div>
            </div>

            <section class="panel" data-i18n-attr="aria-label:sidebar.clients">
              <div id="clients-list-body"></div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <div id="a11y-widget-root"></div>
    <div id="modal-root"></div>

    <script>
      window.IQRAA_PATHS = { root: "../", pages: "" };
      window.IQRAA_ROLE = "admin";
      window.IQRAA_PAGE_TITLE_KEY = "sidebar.clients";
    </script>
    <script src="../js/i18n/translations.js"></script>
    <script src="../js/i18n/i18n.js"></script>
    <script src="../js/vendor/icons.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/workspace-header.js"></script>
    <script src="../js/components/accessibility-widget.js"></script>
    <script src="../js/components/modal.js"></script>
    <script src="../js/services/auth.js"></script>
    <script src="../js/data/mock-data.js"></script>
    <script src="../js/services/project-helpers.js"></script>
    <script src="../js/services/clients-api.js"></script>
    <script src="../js/workspace-chrome.js"></script>
    <script src="../js/pages/clients.js"></script>
  </body>
</html>
