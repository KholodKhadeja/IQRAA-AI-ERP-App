<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../src/images/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>IQRAA Digital Learning | AI Learning Operations ERP</title>
    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/pages/workspace.css" />
    <link rel="stylesheet" href="../css/pages/dashboard-admin.css" />
  </head>
  <body>
    <div class="workspace-shell">
      <div id="sidebar-root"></div>
      <div class="workspace-shell__body">
        <div id="workspace-header-root"></div>
        <main id="main-content" class="workspace-main workspace-main--admin-overview">
          <div class="admin-overview">
            <section class="panel" aria-labelledby="settings-profile-heading">
              <div class="panel__header">
                <h2 class="panel__title" id="settings-profile-heading" data-i18n="settings.profileHeading"></h2>
              </div>
              <div id="settings-profile-body"></div>
            </section>

            <section class="panel" aria-labelledby="settings-preferences-heading">
              <div class="panel__header">
                <h2 class="panel__title" id="settings-preferences-heading" data-i18n="settings.preferencesHeading"></h2>
              </div>
              <div id="settings-preferences-body"></div>
            </section>

            <section class="panel" id="settings-system-section" aria-labelledby="settings-system-heading" hidden>
              <div class="panel__header">
                <h2 class="panel__title" id="settings-system-heading" data-i18n="settings.systemHeading"></h2>
              </div>
              <p class="project-workspace__note" data-i18n="settings.pipelineReferenceNote"></p>
              <ul id="settings-pipeline-reference"></ul>
            </section>
          </div>
        </main>
      </div>
    </div>

    <div id="a11y-widget-root"></div>

    <script>
      window.IQRAA_PATHS = { root: "../", pages: "" };
      (function () {
        var storedRole = null;
        try {
          storedRole = window.sessionStorage.getItem("iqraa-demo-role");
        } catch {
          /* ignore */
        }
        window.IQRAA_PAGE_TITLE_KEY = storedRole === "teamMember" || storedRole === "client" ? "sidebar.profile" : "sidebar.settings";
      })();
    </script>
    <script src="../js/i18n/translations.js"></script>
    <script src="../js/i18n/i18n.js"></script>
    <script src="../js/vendor/icons.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/workspace-header.js"></script>
    <script src="../js/components/accessibility-widget.js"></script>
    <script src="../js/components/text-field.js"></script>
    <script src="../js/services/auth.js"></script>
    <script src="../js/data/mock-data.js"></script>
    <script src="../js/services/project-helpers.js"></script>
    <script src="../js/workspace-chrome.js"></script>
    <script src="../js/pages/settings.js"></script>
  </body>
</html>
