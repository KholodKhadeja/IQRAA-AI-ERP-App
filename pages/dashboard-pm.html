<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="../src/images/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <title>IQRAA Digital Learning | AI Learning Operations ERP</title>
    <link rel="stylesheet" href="../css/shared.css" />
    <link rel="stylesheet" href="../css/pages/workspace.css" />
    <link rel="stylesheet" href="../css/pages/dashboard-admin.css" />
  </head>
  <body>
    <div class="workspace-shell">
      <div id="sidebar-root"></div>
      <div class="workspace-shell__body">
        <div id="workspace-header-root"></div>
        <main id="main-content" class="workspace-main workspace-main--admin-overview">
          <div class="admin-overview">
            <div class="kpi-grid" id="pm-kpi-grid"></div>

            <section class="panel" aria-labelledby="pm-projects-heading">
              <div class="panel__header">
                <h2 class="panel__title" id="pm-projects-heading" data-i18n="pmOverview.sectionMyProjects"></h2>
              </div>
              <div class="admin-overview__table-wrap" id="pm-projects-body"></div>
            </section>

            <section class="panel" aria-labelledby="pm-attention-heading">
              <div class="panel__header">
                <h2 class="panel__title" id="pm-attention-heading" data-i18n="pmOverview.sectionTasksAttention"></h2>
              </div>
              <div id="pm-attention-tasks"></div>
            </section>

            <section class="panel" aria-labelledby="pm-activity-heading">
              <div class="panel__header">
                <h2 class="panel__title" id="pm-activity-heading" data-i18n="pmOverview.sectionRecentActivity"></h2>
              </div>
              <div id="pm-activity-list"></div>
            </section>
          </div>
        </main>
      </div>
    </div>

    <div id="a11y-widget-root"></div>

    <script>
      window.IQRAA_PATHS = { root: "../", pages: "" };
      window.IQRAA_ROLE = "pm";
      window.IQRAA_PAGE_TITLE_KEY = "sidebar.overview";
    </script>
    <script src="../js/i18n/translations.js"></script>
    <script src="../js/i18n/i18n.js"></script>
    <script src="../js/vendor/icons.js"></script>
    <script src="../js/components/sidebar.js"></script>
    <script src="../js/components/workspace-header.js"></script>
    <script src="../js/components/accessibility-widget.js"></script>
    <script src="../js/services/auth.js"></script>
    <script src="../js/data/mock-data.js"></script>
    <script src="../js/services/project-helpers.js"></script>
    <script src="../js/workspace-chrome.js"></script>
    <script src="../js/pages/dashboard-pm.js"></script>
  </body>
</html>
