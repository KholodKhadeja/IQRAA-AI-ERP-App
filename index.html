<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="פיתוח מוצרי למידה דיגיטליים ופתרונות הדרכה, מתכנון ועד השקה."
    />
    <meta name="color-scheme" content="light" />
    <title>IQRAA Digital Learning | AI Learning Operations ERP</title>
    <style>
      #app-preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f8f7fb;
      }
      .app-preloader-mark {
        width: 44px;
        height: 44px;
        border: 4px solid #e7e3ef;
        border-top-color: #6c5ce7;
        border-radius: 50%;
        animation: app-preloader-spin 0.8s linear infinite;
      }
      .app-preloader-label {
        font-family: "Assistant", "Arial", sans-serif;
        font-size: 15px;
        font-weight: 700;
        color: #201d2b;
      }
      @keyframes app-preloader-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .app-preloader-mark {
          animation-duration: 1.6s;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-preloader" role="status" aria-live="polite">
        <span class="app-preloader-mark" aria-hidden="true"></span>
        <span class="app-preloader-label">IQRAA Digital Learning</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
